<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake Efficiency — History & Trends</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1100px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; }
        .header h2 { font-size: 18px; font-weight: 600; color: #5BA4B5; }
        
        .tabs-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .tab {
            padding: 10px 20px;
            background: #1a1a1a;
            border: none;
            color: #888;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            text-decoration: none;
        }
        
        .tab:hover { background: #2a2a2a; color: #fff; }
        .tab.active { background: #5BA4B5; color: #fff; }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .date-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1a1a;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        .date-picker label {
            font-size: 12px;
            color: #888;
            font-weight: 600;
        }
        
        .date-picker input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .date-picker input:focus {
            outline: none;
            border-color: #5BA4B5;
        }
        
        .quick-ranges {
            display: flex;
            gap: 8px;
        }
        
        .quick-btn {
            padding: 8px 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .quick-btn:hover { background: #2a2a2a; color: #fff; border-color: #444; }
        .quick-btn.active { background: #5BA4B5; color: #fff; border-color: #5BA4B5; }
        
        .load-btn {
            padding: 10px 25px;
            background: #5BA4B5;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .load-btn:hover { background: #4a93a4; }
        .load-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .summary-card .value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .summary-card .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .summary-card.elite .value { color: #4ade80; }
        .summary-card.solid .value { color: #5BA4B5; }
        .summary-card.warning .value { color: #fbbf24; }
        .summary-card.danger .value { color: #ef4444; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 800px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
        
        .chart-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }
        
        .chart-card.full-width {
            grid-column: 1 / -1;
        }
        
        .chart-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #5BA4B5;
        }
        
        .chart-container {
            position: relative;
            height: 250px;
        }
        
        .chart-container.tall {
            height: 350px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .data-table th {
            background: #1a1a1a;
            padding: 10px 8px;
            text-align: left;
            font-weight: 600;
            color: #888;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
        }
        
        .data-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #222;
        }
        
        .data-table tr:hover {
            background: #1a1a1a;
        }
        
        .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
        
        .rate-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .rate-badge.elite { background: #4ade80; color: #000; }
        .rate-badge.solid { background: #5BA4B5; color: #fff; }
        .rate-badge.average { background: #fbbf24; color: #000; }
        .rate-badge.below { background: #ef4444; color: #fff; }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 16px;
        }
        
        .loading.error { color: #ef4444; }
        
        .table-wrapper {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 8px;
        }
        
        .specialist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .specialist-card {
            background: #222;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .specialist-card .name {
            font-size: 13px;
            font-weight: 500;
        }
        
        .specialist-card .stats {
            text-align: right;
            font-size: 12px;
        }
        
        .specialist-card .ld {
            font-weight: 700;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>INTAKE EFFICIENCY</h1>
            <h2>History & Trends</h2>
        </div>
        
        <div class="tabs-row">
            <a href="index.html" class="tab">Live Dashboard</a>
            <a href="history.html" class="tab active">History</a>
            <a href="admin.html" class="tab">Admin</a>
        </div>
        
        <div class="controls">
            <div class="date-picker">
                <label>From:</label>
                <input type="date" id="startDate">
                <label>To:</label>
                <input type="date" id="endDate">
            </div>
            
            <div class="quick-ranges">
                <button class="quick-btn" data-range="7">7 Days</button>
                <button class="quick-btn active" data-range="14">14 Days</button>
                <button class="quick-btn" data-range="30">30 Days</button>
                <button class="quick-btn" data-range="mtd">MTD</button>
            </div>
            
            <button class="load-btn" id="loadBtn">Load Data</button>
        </div>
        
        <div id="content">
            <div class="loading">Select a date range and click "Load Data"</div>
        </div>
    </div>
    
    <script>
        // Supabase config
        const SUPABASE_URL = 'https://ymhhdipaplhzxpfhrunp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_f_3vIV-VzDkK9UPxmDx1Sw_UXZ78iJq';
        
        // Chart instances
        let trendsChart = null;
        let rateChart = null;
        
        let specialistChart = null;
        
        // Initialize dates
        function initDates() {
            const today = new Date();
            const twoWeeksAgo = new Date(today);
            twoWeeksAgo.setDate(today.getDate() - 14);
            
            document.getElementById('endDate').value = formatDate(today);
            document.getElementById('startDate').value = formatDate(twoWeeksAgo);
        }
        
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }
        
        function formatDisplayDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
        
        // Quick range buttons
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const range = btn.dataset.range;
                const today = new Date();
                let startDate = new Date(today);
                
                if (range === 'mtd') {
                    startDate = new Date(today.getFullYear(), today.getMonth(), 1);
                } else {
                    startDate.setDate(today.getDate() - parseInt(range));
                }
                
                document.getElementById('endDate').value = formatDate(today);
                document.getElementById('startDate').value = formatDate(startDate);
            });
        });
        
        // Load data button
        document.getElementById('loadBtn').addEventListener('click', loadData);
        
        async function loadData() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }
            
            const loadBtn = document.getElementById('loadBtn');
            loadBtn.disabled = true;
            loadBtn.textContent = 'Loading...';
            
            document.getElementById('content').innerHTML = '<div class="loading">Fetching historical data...</div>';
            
            try {
                const url = `${SUPABASE_URL}/rest/v1/intake_daily?intake_date=gte.${startDate}&intake_date=lte.${endDate}&order=intake_date.asc`;
                console.log('Fetching:', url);
                
                const response = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    throw new Error(`Failed to fetch data: ${response.status} - ${errorText}`);
                }
                
                const data = await response.json();
                
                if (data.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="loading">No data found for selected date range</div>';
                    return;
                }
                
                renderDashboard(data, startDate, endDate);
                
            } catch (error) {
                console.error(error);
                document.getElementById('content').innerHTML = `<div class="loading error">Error: ${error.message}</div>`;
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = 'Load Data';
            }
        }
        
        function getRateTier(rate) {
            if (rate >= 1.0) return { label: 'Elite', class: 'elite' };
            if (rate >= 0.6) return { label: 'Solid', class: 'solid' };
            if (rate >= 0.4) return { label: 'Average', class: 'average' };
            return { label: 'Below', class: 'below' };
        }
        
        function renderDashboard(data, startDate, endDate) {
            // Calculate summary stats
            const totalLd = data.reduce((sum, d) => sum + (d.total_ld || 0), 0);
            const totalCameIn = data.reduce((sum, d) => sum + (d.came_in || 0), 0);
            const totalDropped = data.reduce((sum, d) => sum + (d.dropped || 0), 0);
            const totalHours = data.reduce((sum, d) => sum + (d.total_scheduled_hours || 0), 0);
            const avgLdPerHour = totalHours > 0 ? (totalLd / totalHours) : 0;
            const avgLdPerDay = totalLd / data.length;
            const conversionRate = totalLd > 0 ? ((totalCameIn / totalLd) * 100) : 0;
            
            // Aggregate specialist data across all days
            const specialistTotals = {};
            data.forEach(day => {
                (day.by_specialist || []).forEach(s => {
                    const name = s.name || s.email?.split('@')[0] || 'Unknown';
                    if (!specialistTotals[name]) {
                        specialistTotals[name] = { ld: 0, came_in: 0, dropped: 0, hours: 0, days: 0 };
                    }
                    specialistTotals[name].ld += s.ld || 0;
                    specialistTotals[name].came_in += s.came_in || 0;
                    specialistTotals[name].dropped += s.dropped || 0;
                    specialistTotals[name].hours += s.hours || 0;
                    if (!s.is_off) specialistTotals[name].days += 1;
                });
            });
            
            // Sort specialists by LD
            const topSpecialists = Object.entries(specialistTotals)
                .map(([name, stats]) => ({ name, ...stats, rate: stats.hours > 0 ? stats.ld / stats.hours : 0 }))
                .sort((a, b) => b.ld - a.ld)
;
            
            const rateTier = getRateTier(avgLdPerHour);
            
            let html = `
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="value">${totalLd.toLocaleString()}</div>
                        <div class="label">Total Lockdowns</div>
                    </div>
                    <div class="summary-card ${rateTier.class}">
                        <div class="value">${avgLdPerHour.toFixed(2)}</div>
                        <div class="label">Avg LD/Hour</div>
                    </div>
                    <div class="summary-card">
                        <div class="value">${avgLdPerDay.toFixed(0)}</div>
                        <div class="label">Avg LD/Day</div>
                    </div>
                </div>
                
                <div class="charts-grid">
                    <div class="chart-card full-width">
                        <h3>📈 Daily Lockdowns & Came In</h3>
                        <div class="chart-container tall">
                            <canvas id="trendsChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-card">
                        <h3>⚡ LD/Hour by Day</h3>
                        <div class="chart-container">
                            <canvas id="rateChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-card full-width">
                        <h3>🏆 Intake Specialists (by Total LD)</h3>
                        <div class="chart-container" style="height: ${Math.max(400, topSpecialists.length * 35)}px;">
                            <canvas id="specialistChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <div class="chart-card">
                    <h3>📊 Daily Breakdown</h3>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th class="num">Total LD</th>
                                    <th class="num">Still LD</th>
                                    <th class="num">Came In</th>
                                    <th class="num">Dropped</th>
                                    <th class="num">Hours</th>
                                    <th class="num">LD/Hr</th>
                                    <th>Tier</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.map(d => {
                                    const rate = d.total_scheduled_hours > 0 ? d.total_ld / d.total_scheduled_hours : 0;
                                    const tier = getRateTier(rate);
                                    return `
                                        <tr>
                                            <td>${formatDisplayDate(d.intake_date)}</td>
                                            <td class="num">${d.total_ld || 0}</td>
                                            <td class="num">${d.still_ld || 0}</td>
                                            <td class="num">${d.came_in || 0}</td>
                                            <td class="num">${d.dropped || 0}</td>
                                            <td class="num">${(d.total_scheduled_hours || 0).toFixed(0)}</td>
                                            <td class="num">${rate.toFixed(2)}</td>
                                            <td><span class="rate-badge ${tier.class}">${tier.label}</span></td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
            
            // Render charts
            renderCharts(data, topSpecialists);
        }
        
        function renderCharts(data, topSpecialists) {
            const labels = data.map(d => formatDisplayDate(d.intake_date));
            
            // Destroy existing charts
            if (trendsChart) trendsChart.destroy();
            if (rateChart) rateChart.destroy();
            
            if (specialistChart) specialistChart.destroy();
            
            // Common chart options
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: '#888' }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#888' },
                        grid: { color: '#333' }
                    },
                    y: {
                        ticks: { color: '#888' },
                        grid: { color: '#333' }
                    }
                }
            };
            
            // Trends chart (LD + Came In)
            trendsChart = new Chart(document.getElementById('trendsChart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Total LD',
                            data: data.map(d => d.total_ld || 0),
                            backgroundColor: '#5BA4B5',
                            borderRadius: 4
                        },
                        {
                            label: 'Came In',
                            data: data.map(d => d.came_in || 0),
                            backgroundColor: '#4ade80',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        tooltip: {
                            callbacks: {
                                afterBody: (context) => {
                                    const idx = context[0].dataIndex;
                                    const d = data[idx];
                                    return `Still LD: ${d.still_ld || 0}\nDropped: ${d.dropped || 0}`;
                                }
                            }
                        }
                    }
                }
            });
            
            // Rate chart
            const rates = data.map(d => d.total_scheduled_hours > 0 ? d.total_ld / d.total_scheduled_hours : 0);
            rateChart = new Chart(document.getElementById('rateChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'LD/Hour',
                        data: rates,
                        borderColor: '#5BA4B5',
                        backgroundColor: 'rgba(91, 164, 181, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        annotation: {
                            annotations: {
                                line1: {
                                    type: 'line',
                                    yMin: 0.6,
                                    yMax: 0.6,
                                    borderColor: '#fbbf24',
                                    borderWidth: 1,
                                    borderDash: [5, 5]
                                },
                                line2: {
                                    type: 'line',
                                    yMin: 1.0,
                                    yMax: 1.0,
                                    borderColor: '#4ade80',
                                    borderWidth: 1,
                                    borderDash: [5, 5]
                                }
                            }
                        }
                    }
                }
            });
            
            // Specialist chart - horizontal bar
            specialistChart = new Chart(document.getElementById('specialistChart'), {
                type: 'bar',
                data: {
                    labels: topSpecialists.map(s => `${s.name} (${s.rate.toFixed(2)})`),
                    datasets: [{
                        label: 'Total LD',
                        data: topSpecialists.map(s => s.ld),
                        backgroundColor: topSpecialists.map(s => {
                            const tier = getRateTier(s.rate);
                            if (tier.class === 'elite') return '#4ade80';
                            if (tier.class === 'solid') return '#5BA4B5';
                            if (tier.class === 'average') return '#fbbf24';
                            return '#ef4444';
                        }),
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: { color: '#888' },
                            grid: { color: '#333' }
                        },
                        y: {
                            ticks: { color: '#888' },
                            grid: { color: '#333' }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                afterLabel: (context) => {
                                    const s = topSpecialists[context.dataIndex];
                                    return `Rate: ${s.rate.toFixed(2)} LD/hr | Days: ${s.days}`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // Initialize
        initDates();
    </script>
</body>
</html>
